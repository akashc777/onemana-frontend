name: CI

# Tests that nobody runs protect nothing.
#
# This repo had no CI and no test framework. It now has tests covering the two HTML
# injection sinks that render with dangerouslySetInnerHTML — the Markdown sanitiser and the
# JSON-LD serialiser — and those are only worth having if a pull request cannot merge past
# them.
#
# Shaped after onecamp-fe's workflow so the two repos behave the same way, minus the
# Playwright job: there are no e2e tests here yet. npm rather than pnpm, matching this
# repo's package-lock.json.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build-unit:
    name: Lint / Build / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install
        # ci, not install: fails on a lockfile that does not match package.json rather
        # than quietly resolving something else, which is the point of having the lockfile.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # next build does typecheck, but running tsc separately means a type error is
        # reported as a type error rather than as a build failure several minutes in.
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        # Builds as production would, catching anything the editor and tsc let past.
        run: npm run build

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-1.60.0-${{ runner.os }}

      - name: Render check
        # The build, served, as a visitor sees it: four key pages at 390 and 1280 px,
        # light and dark; the main heading must be visible and on top, with no page
        # error and no sideways scroll on a phone. On 19 Oct 2026 every page answered
        # 200 while an open phone menu covered all of them. Playwright is installed
        # outside the project so the lockfile is untouched.
        run: |
          npm i --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.60.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium > /dev/null
          npm start -- -p 3917 > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 1 60); do curl -s -o /dev/null http://localhost:3917/ && break; sleep 1; done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" \
            node scripts/synthetic/check.mjs --base http://localhost:3917 --no-api --render --retry 0
